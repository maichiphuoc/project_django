{% extends 'base.html' %}

{% block css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'Users/css/account.css' %}">
{% endblock %}


{% block menu %}

    {% include 'Users/accountMenu.html' %}

{% endblock %}


{% block content %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="account-form-group">
            <label>Username:</label>
            {{ form.username }}
        </div>

        <div class="account-form-group">
            <label>Email:</label>
            {{ form.email }}
        </div>

        <div class="account-form-group">
            <label>Password:</label>
            {{ form.password }}
        </div>

        <div class="account-form-group">
            <label>Country:</label>
            {{ form.id_country }}
        </div>

        <div class="account-form-group">
            <label>Avatar:</label>
            {{ form.avatar }}
        </div>

        <button type="submit">
            UPDATE
        </button>

    </form>


{% endblock %}
